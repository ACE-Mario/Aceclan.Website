<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACE Clan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0f14;
    color: #e8e8e8;
    font-family: 'Segoe UI', Arial, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1a1d29, #2a1a3e);
    padding: 60px 20px;
    text-align: center;
    border-bottom: 3px solid #7c3aed;
  }
  header h1 {
    font-size: 3.5rem;
    letter-spacing: 4px;
    color: #a78bfa;
    text-shadow: 0 0 20px rgba(124, 58, 237, 0.6);
  }
  header p {
    margin-top: 10px;
    color: #9ca3af;
    font-size: 1.1rem;
  }
  section#image-display {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 20px;
    text-align: center;
  }
  section#image-display img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    border: 1px solid #2e2f3e;
    box-shadow: 0 0 30px rgba(124, 58, 237, 0.25);
  }
  footer {
    text-align: center;
    padding: 30px;
    color: #6b7280;
    font-size: 0.9rem;
    border-top: 1px solid #2e2f3e;
  }
</style>
</head>
<body>

<header>
  <h1>ACE CLAN</h1>
  <p>aceclan.lol</p>
</header>

<section id="image-display">
  <img src="your-image.jpg" alt="ACE Clan">
</section>

<footer>
  &copy; 2026 ACE Clan
</footer>

</body>
</html>
